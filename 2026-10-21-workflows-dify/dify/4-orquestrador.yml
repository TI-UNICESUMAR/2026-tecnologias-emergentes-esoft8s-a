        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
    - id: decisao-true-saida-target
      source: decisao
      sourceHandle: 'true'
      target: saida
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
