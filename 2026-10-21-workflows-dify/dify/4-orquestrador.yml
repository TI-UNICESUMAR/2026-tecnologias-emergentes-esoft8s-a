        targetType: end
    - id: decisao-false-saida_erro-target
      source: decisao
      sourceHandle: 'false'
      target: saida_erro
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
